[package]
name = "photolibrariancore"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
duckdb = { version = "1.1", features = ["bundled"] }
lancedb = "0.14"
arrow-array = "53"
arrow-schema = "53"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.28"
once_cell = "1.20"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
uniffi_bindgen = "0.28"
